# Runs the API and the web console. Secrets come from .env (see .env.example).
services:
  api:
    build: .
    env_file: .env
    environment:
      FISHINGMAILS_CORS_ORIGINS: ${FISHINGMAILS_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - fishingmails_data:/data
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  fishingmails_data:
