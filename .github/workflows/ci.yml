name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-python:
    name: Python Security & Agent Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pydantic langgraph langchain-core langchain beautifulsoup4 requests python-magic-bin dnspython

      - name: Run Test Suites
        run: |
          PYTHONPATH=. pytest tests/ -v

  typecheck-frontend:
    name: Next.js Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package.json"

      - name: Install Web Dependencies
        working-directory: apps/web
        run: |
          npm ci || npm install

      - name: TypeScript & Lint Check
        working-directory: apps/web
        run: |
          npx tsc --noEmit
