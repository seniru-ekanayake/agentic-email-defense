<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 290" width="1280" height="290" role="img" aria-label="Five stage pipeline: parse, seed evidence, plan and act in a loop, verdict, respond with analyst approval">
  <defs>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .m { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .card { animation: pop 0.9s ease-out both; }
      @keyframes pop { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      .flow { animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -22; } }
    </style>
  </defs>
  <rect width="1280" height="290" rx="20" fill="#080c18"/>
  <text x="40" y="26" class="m" font-size="12" letter-spacing="4" fill="#475569">INVESTIGATION PIPELINE</text>
  
  <g class="card" style="animation-delay:0.0s">
    <rect x="40" y="40" width="212" height="170" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="40" y="40" width="212" height="5" rx="2.5" fill="#22d3ee"/>
    <text x="60" y="88" class="m" font-size="14" fill="#22d3ee">01</text>
    <text x="60" y="124" class="t" font-size="24" font-weight="700" fill="#f1f5f9">PARSE</text>
    <text x="60" y="160" class="t" font-size="14" fill="#94a3b8">MIME, headers, links,</text>
    <text x="60" y="182" class="t" font-size="14" fill="#94a3b8">Unicode, attachments</text>
  </g>  <path d="M256 125 h18" stroke="#475569" stroke-width="2"/><path d="M270 119 l8 6 l-8 6" fill="none" stroke="#475569" stroke-width="2"/>
  <g class="card" style="animation-delay:0.25s">
    <rect x="278" y="40" width="212" height="170" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="278" y="40" width="212" height="5" rx="2.5" fill="#38bdf8"/>
    <text x="298" y="88" class="m" font-size="14" fill="#38bdf8">02</text>
    <text x="298" y="124" class="t" font-size="24" font-weight="700" fill="#f1f5f9">SEED</text>
    <text x="298" y="160" class="t" font-size="14" fill="#94a3b8">Typed evidence</text>
    <text x="298" y="182" class="t" font-size="14" fill="#94a3b8">from parser findings</text>
  </g>  <path d="M494 125 h18" stroke="#475569" stroke-width="2"/><path d="M508 119 l8 6 l-8 6" fill="none" stroke="#475569" stroke-width="2"/>
  <g class="card" style="animation-delay:0.5s">
    <rect x="516" y="40" width="212" height="170" rx="16" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="516" y="40" width="212" height="5" rx="2.5" fill="#818cf8"/>
    <text x="536" y="88" class="m" font-size="14" fill="#818cf8">03</text>
    <text x="536" y="124" class="t" font-size="24" font-weight="700" fill="#f1f5f9">PLAN + ACT</text>
    <text x="536" y="160" class="t" font-size="14" fill="#94a3b8">Planner picks next</text>
    <text x="536" y="182" class="t" font-size="14" fill="#94a3b8">read-only tool, repeat</text>
  </g>  <path d="M732 125 h18" stroke="#475569" stroke-width="2"/><path d="M746 119 l8 6 l-8 6" fill="none" stroke="#475569" stroke-width="2"/>
  <g class="card" style="animation-delay:0.75s">
    <rect x="754" y="40" width="212" height="170" rx="16" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="754" y="40" width="212" height="5" rx="2.5" fill="#a78bfa"/>
    <text x="774" y="88" class="m" font-size="14" fill="#a78bfa">04</text>
    <text x="774" y="124" class="t" font-size="24" font-weight="700" fill="#f1f5f9">VERDICT</text>
    <text x="774" y="160" class="t" font-size="14" fill="#94a3b8">Score only recorded</text>
    <text x="774" y="182" class="t" font-size="14" fill="#94a3b8">evidence, with provenance</text>
  </g>  <path d="M970 125 h18" stroke="#475569" stroke-width="2"/><path d="M984 119 l8 6 l-8 6" fill="none" stroke="#475569" stroke-width="2"/>
  <g class="card" style="animation-delay:1.0s">
    <rect x="992" y="40" width="212" height="170" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="992" y="40" width="212" height="5" rx="2.5" fill="#f59e0b"/>
    <text x="1012" y="88" class="m" font-size="14" fill="#f59e0b">05</text>
    <text x="1012" y="124" class="t" font-size="24" font-weight="700" fill="#f1f5f9">RESPOND</text>
    <text x="1012" y="160" class="t" font-size="14" fill="#94a3b8">Propose containment,</text>
    <text x="1012" y="182" class="t" font-size="14" fill="#94a3b8">analyst approves</text>
  </g>  <path d="M546 222 q76 30 152 0" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="5 6" class="flow"/>
  <text x="622" y="262" class="m" font-size="12" fill="#818cf8" text-anchor="middle" letter-spacing="2">NEW EVIDENCE, RE-PLAN</text>
</svg>
